<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة التحكم | MANHWA SLIME</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/supabase-config.js"></script><style>
:root{--bg:#0c0d0f;--surface:#15171a;--surface2:#1b1e22;--border:#2a2c32;--green:#8cff6b;--purple:#a78bfa;--text:#f5f5f2;--muted:#a1a1a8;--danger:#ff8b8b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Cairo,system-ui,sans-serif}header{border-bottom:1px solid var(--border);background:#0c0d0fee;position:sticky;top:0;z-index:2}.bar{max-width:1200px;margin:auto;padding:15px 22px;display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{display:flex;align-items:center;gap:10px;font-weight:800}.brand img{width:34px;height:34px;border-radius:10px;object-fit:cover}button,.btn{border:0;border-radius:10px;padding:10px 16px;background:var(--green);color:#0c0d0f;font:700 13px Cairo;cursor:pointer;text-decoration:none;display:inline-block}button.secondary,.btn.secondary{background:transparent;color:var(--text);border:1px solid var(--border)}button.danger{background:transparent;color:var(--danger);border:1px solid #623b42}.wrap{max-width:1200px;margin:auto;padding:30px 22px}.welcome{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:24px}.welcome h1{margin:0;font-size:27px}.muted{color:var(--muted);font-size:13px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat,.panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px}.stat .num{font-size:28px;font-weight:800;color:var(--green);margin-top:5px}.layout{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;margin-top:18px}.panel h2{font-size:18px;margin:0 0 15px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.tabs button{background:var(--surface2);color:var(--muted);border:1px solid var(--border)}.tabs button.active{background:var(--purple);color:#15121d;border-color:var(--purple)}.tab{display:none}.tab.active{display:block}label{display:block;color:var(--muted);font-size:12px;margin:12px 0 5px}input,textarea,select{width:100%;background:#101114;border:1px solid var(--border);border-radius:9px;color:var(--text);padding:10px;font:inherit}textarea{min-height:95px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.check{display:flex;align-items:center;gap:8px;margin:12px 0;color:var(--muted);font-size:13px}.check input{width:auto}.msg{min-height:23px;color:var(--purple);font-size:13px;margin-top:10px}.list{display:flex;flex-direction:column;gap:9px}.item{background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:12px}.item strong{display:block}.badge{display:inline-block;border-radius:999px;padding:3px 9px;font-size:11px;margin-top:7px;background:#243b26;color:var(--green)}.badge.draft{background:#332c1d;color:#ffd58a}.release-notes{font-size:12px;color:var(--muted);padding-right:20px}.full{grid-column:1/-1}.small-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.progress{height:5px;background:#25272b;border-radius:5px;overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;width:0;background:var(--green)}@media(max-width:850px){.cards{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}}@media(max-width:500px){.wrap{padding:22px 14px}.bar{padding:12px 14px}.cards{gap:9px}.stat{padding:13px}.stat .num{font-size:22px}.row{grid-template-columns:1fr}.welcome{align-items:start;flex-direction:column}}
</style></head><body><header><div class="bar"><div class="brand"><img src="../assets/images/logo.png" alt=""><span>MANHWA SLIME · الإدارة</span></div><div><a class="btn secondary" href="../">الموقع</a> <button id="logout" class="secondary">تسجيل الخروج</button></div></div></header><main class="wrap"><div class="welcome"><div><h1>لوحة التحكم</h1><div class="muted" id="who">جارٍ التحقق من الصلاحية…</div></div><div class="muted" id="notice"></div></div><section class="cards"><div class="stat"><div class="muted">الإصدارات المنشورة</div><div class="num" id="sReleases">—</div></div><div class="stat"><div class="muted">الإصدار الحالي</div><div class="num" id="sVersion">—</div></div><div class="stat"><div class="muted">الأخبار المنشورة</div><div class="num" id="sNews">—</div></div><div class="stat"><div class="muted">حالة التنزيل</div><div class="num" id="sDownload">—</div></div></section><div class="layout"><section class="panel"><div class="tabs"><button class="active" data-tab="release">إصدار جديد</button><button data-tab="news">خبر جديد</button><button data-tab="settings">إعدادات الموقع</button></div><div class="tab active" id="tab-release"><h2>إدارة تحديثات التطبيق</h2><form id="releaseForm"><div class="row"><div><label>رقم الإصدار الظاهر</label><input id="versionName" placeholder="1.2.0" required></div><div><label>versionCode الداخلي</label><input id="versionCode" type="number" min="1" required></div></div><label>عنوان التحديث</label><input id="releaseTitle" required placeholder="تحسينات وإصلاحات جديدة"><label>التغييرات، سطر لكل تغيير</label><textarea id="releaseNotes" placeholder="تحسين الأداء&#10;إصلاح بعض الأخطاء"></textarea><label>ملف APK</label><input id="apk" type="file" accept=".apk,application/vnd.android.package-archive" required><div class="progress"><i id="bar"></i></div><label class="check"><input id="mandatory" type="checkbox"> تحديث إلزامي</label><button id="saveRelease">حفظ كمسودة</button> <button type="button" class="secondary" id="publishRelease">حفظ ونشر</button><div class="msg" id="releaseMsg"></div></form></div><div class="tab" id="tab-news"><h2>إدارة الأخبار والإعلانات</h2><form id="newsForm"><label>عنوان الخبر</label><input id="newsTitle" required><label>المحتوى</label><textarea id="newsBody" required></textarea><label>تاريخ النشر (اختياري)</label><input id="newsDate" type="datetime-local"><button>حفظ كمسودة</button> <button type="button" class="secondary" id="publishNews">حفظ ونشر</button><div class="msg" id="newsMsg"></div></form></div><div class="tab" id="tab-settings"><h2>إعدادات الموقع</h2><form id="settingsForm"><label>اسم التطبيق</label><input id="appName"><label>وصف الموقع</label><textarea id="siteDescription"></textarea><label>رابط تنزيل التطبيق الحالي</label><input id="downloadUrl" type="url"><label>رسالة الإعلان</label><input id="announcement"><label class="check"><input id="announcementVisible" type="checkbox"> إظهار الإعلان</label><button>حفظ الإعدادات</button><div class="msg" id="settingsMsg"></div></form></div></section><section class="panel"><h2>آخر العمليات</h2><div class="list" id="audit"><div class="muted">جارٍ التحميل…</div></div></section><section class="panel full"><h2>الإصدارات السابقة</h2><div class="list" id="releaseList"><div class="muted">جارٍ التحميل…</div></div></section><section class="panel full"><h2>الأخبار</h2><div class="list" id="newsList"><div class="muted">جارٍ التحميل…</div></div></section></div></main><script>
const db=supabase.createClient(window.MSL_SUPABASE_URL,window.MSL_SUPABASE_KEY);let role='user';const $=id=>document.getElementById(id), msg=(id,t)=>$(id).textContent=t;
async function boot(){const {data:{session}}=await db.auth.getSession();if(!session){location.href='index.html';return}const r=await db.rpc('get_my_admin_role');role=r.data||'user';if(!['owner','admin'].includes(role)){await db.auth.signOut();location.href='index.html';return} $('who').textContent=`الحساب: ${session.user.email} · الدور: ${role}`;await Promise.all([loadReleases(),loadNews(),loadSettings(),loadAudit()])}
async function loadReleases(){const {data,error}=await db.from('app_releases').select('*').order('created_at',{ascending:false}).limit(50);if(error){msg('notice','تعذر قراءة الإصدارات');return}const published=data.filter(x=>x.status==='published');$('sReleases').textContent=published.length;$('sVersion').textContent=published[0]?.version_name||'—';$('sDownload').textContent=published[0]?.download_url?'متاح':'غير متاح';$('releaseList').innerHTML=data.length?data.map(x=>`<div class="item"><strong>${esc(x.title)} · ${esc(x.version_name)}</strong><span class="muted">versionCode: ${x.version_code} · ${new Date(x.created_at).toLocaleDateString('ar')}</span><br><span class="badge ${x.status==='draft'?'draft':''}">${x.status==='published'?'منشور':x.status==='draft'?'مسودة':'مسحوب'}</span>${x.status==='draft'?`<div class="small-actions"><button class="secondary" onclick="publish('${x.id}')">نشر الإصدار</button></div>`:''}</div>`).join(''):'<div class="muted">لا توجد إصدارات بعد.</div>'}
async function loadNews(){const {data,error}=await db.from('site_news').select('*').order('created_at',{ascending:false}).limit(50);if(error)return;$('sNews').textContent=data.filter(x=>x.status==='published').length;$('newsList').innerHTML=data.length?data.map(x=>`<div class="item"><strong>${esc(x.title)}</strong><span class="muted">${new Date(x.created_at).toLocaleDateString('ar')}</span><br><span class="badge ${x.status==='draft'?'draft':''}">${x.status==='published'?'منشور':x.status==='draft'?'مسودة':'مسحوب'}</span>${x.status==='draft'?`<div class="small-actions"><button class="secondary" onclick="publishNewsById('${x.id}')">نشر الخبر</button></div>`:''}</div>`).join(''):'<div class="muted">لا توجد أخبار بعد.</div>'}
async function loadSettings(){const {data}=await db.from('site_settings').select('*').eq('id',true).single();if(!data)return;$('appName').value=data.app_name||'';$('siteDescription').value=data.site_description||'';$('downloadUrl').value=data.current_download_url||'';$('announcement').value=data.announcement||'';$('announcementVisible').checked=!!data.announcement_visible}
async function loadAudit(){const {data}=await db.rpc('get_admin_audit_logs',{p_limit:12,p_offset:0});$('audit').innerHTML=data?.length?data.map(x=>`<div class="item"><strong>${esc(x.action)}</strong><span class="muted">${new Date(x.created_at).toLocaleString('ar')}</span></div>`).join(''):'<div class="muted">لا توجد عمليات مسجلة.</div>'}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
async function uploadApk(file){if(!file||file.size>200*1024*1024)throw Error('حجم APK يجب ألا يتجاوز 200MB');const head=new Uint8Array(await file.slice(0,4).arrayBuffer());if(head[0]!==80||head[1]!==75)throw Error('الملف لا يبدو كحزمة APK صالحة');const path=`${crypto.randomUUID()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;const {error}=await db.storage.from('app-releases').upload(path,file,{contentType:'application/vnd.android.package-archive',upsert:false});if(error)throw error;return {path,url:`${window.MSL_SUPABASE_URL}/storage/v1/object/public/app-releases/${path}`}}
async function saveRelease(publishNow){const file=$('apk').files[0];if(!file){msg('releaseMsg','اختر ملف APK أولًا');return}msg('releaseMsg','جارٍ فحص ورفع APK…');$('bar').style.width='35%';try{const up=await uploadApk(file);$('bar').style.width='70%';const notes=$('releaseNotes').value.split('\n').map(x=>x.trim()).filter(Boolean);const payload={version_name:$('versionName').value.trim(),version_code:Number($('versionCode').value),title:$('releaseTitle').value.trim(),release_notes:notes,mandatory:$('mandatory').checked,status:'draft',storage_path:up.path,download_url:up.url,file_size:file.size,sha256:null,created_by:(await db.auth.getUser()).data.user.id};const {data,error}=await db.from('app_releases').insert(payload).select().single();if(error)throw error;if(publishNow){const p=await db.rpc('publish_app_release',{p_release_id:data.id});if(p.error)throw p.error}$('bar').style.width='100%';msg('releaseMsg',publishNow?'تم حفظ الإصدار ونشره بنجاح.':'تم حفظ الإصدار كمسودة.');$('releaseForm').reset();await loadReleases();await loadAudit()}catch(e){msg('releaseMsg',e.message||'تعذر حفظ الإصدار');$('bar').style.width='0'}}
$('releaseForm').addEventListener('submit',e=>{e.preventDefault();saveRelease(false)});$('publishRelease').onclick=()=>saveRelease(true);window.publish=async id=>{if(!confirm('هل تريد نشر هذا الإصدار؟ سيتم سحب الإصدار المنشور السابق.'))return;const {error}=await db.rpc('publish_app_release',{p_release_id:id});if(error)alert(error.message);else{await loadReleases();await loadAudit()}};
$('newsForm').addEventListener('submit',async e=>{e.preventDefault();await saveNews(false)});$('publishNews').onclick=()=>saveNews(true);async function saveNews(p){msg('newsMsg','جارٍ الحفظ…');const u=(await db.auth.getUser()).data.user;const {error}=await db.from('site_news').insert({title:$('newsTitle').value.trim(),body:$('newsBody').value.trim(),status:p?'published':'draft',published_at:p?($('newsDate').value?new Date($('newsDate').value).toISOString():new Date().toISOString()):null,created_by:u.id});msg('newsMsg',error?error.message:(p?'تم نشر الخبر.':'تم حفظ الخبر كمسودة.'));if(!error){$('newsForm').reset();await loadNews();await loadAudit()}}window.publishNewsById=async id=>{if(!confirm('نشر هذا الخبر؟'))return;const {error}=await db.from('site_news').update({status:'published',published_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq('id',id);if(error)alert(error.message);else{await loadNews();await loadAudit()}};
$('settingsForm').addEventListener('submit',async e=>{e.preventDefault();const {error}=await db.from('site_settings').upsert({id:true,app_name:$('appName').value.trim(),site_description:$('siteDescription').value.trim(),current_download_url:$('downloadUrl').value.trim()||null,announcement:$('announcement').value.trim(),announcement_visible:$('announcementVisible').checked,updated_by:(await db.auth.getUser()).data.user.id,updated_at:new Date().toISOString()});msg('settingsMsg',error?error.message:'تم حفظ الإعدادات.')});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('tab-'+b.dataset.tab).classList.add('active')});$('logout').onclick=async()=>{await db.auth.signOut();location.href='index.html'};boot();
</script></body></html>
