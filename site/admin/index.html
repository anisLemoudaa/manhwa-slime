<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة MANHWA SLIME</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/supabase-config.js"></script><style>
:root{--bg:#0c0d0f;--surface:#15171a;--border:#292b31;--green:#8cff6b;--purple:#a78bfa;--text:#f5f5f2;--muted:#a1a1a8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 75% 10%,#18241b,transparent 38%),var(--bg);color:var(--text);font-family:Cairo,system-ui,sans-serif;min-height:100vh}main{max-width:520px;margin:0 auto;padding:8vh 22px}.brand{text-align:center;margin-bottom:26px}.mark{width:82px;height:82px;border-radius:22px;object-fit:cover;box-shadow:0 15px 45px #0008}.brand h1{margin:14px 0 2px;font-size:25px}.brand p{color:var(--muted);margin:0}.card{background:#15171aeF;border:1px solid var(--border);border-radius:22px;padding:25px;box-shadow:0 18px 60px #0005}label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}input{width:100%;background:#101114;border:1px solid var(--border);border-radius:11px;color:var(--text);padding:13px;font:inherit;direction:ltr;text-align:left}input:focus{outline:2px solid var(--green)}button{width:100%;border:0;border-radius:11px;padding:13px;margin-top:20px;background:var(--green);font:700 15px Cairo;color:#0c0d0f;cursor:pointer}button.google{background:#fff;color:#202124;margin-top:12px}button:disabled{opacity:.6}.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:18px 0}.divider:before,.divider:after{content:'';height:1px;background:var(--border);flex:1}.msg{min-height:24px;text-align:center;margin:14px 0 0;color:var(--purple);font-size:13px}.hint{font-size:12px;color:var(--muted);line-height:1.8;margin-top:20px;text-align:center}.back{display:block;text-align:center;margin-top:18px;color:var(--green);text-decoration:none;font-size:13px}
</style></head><body><main><div class="brand"><img class="mark" src="../assets/images/logo.png" alt="MANHWA SLIME"><h1>لوحة إدارة MANHWA SLIME</h1><p>دخول المالك والإدارة المصرّح بها</p></div><section class="card"><form id="login"><label for="email">البريد الإلكتروني</label><input id="email" type="email" autocomplete="username" required><label for="password">كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required><button id="submit">تسجيل الدخول</button></form><div class="divider">أو</div><button class="google" id="googleLogin" type="button">الدخول باستخدام Google</button><div class="msg" id="msg"></div><div class="hint">لا يوجد إنشاء حساب من هذه الصفحة. يجب أن يكون حساب Google مضافًا مسبقًا إلى صلاحيات الإدارة.</div></section><a class="back" href="../">العودة إلى الموقع الرسمي</a></main><script>
const db=supabase.createClient(window.MSL_SUPABASE_URL,window.MSL_SUPABASE_KEY);const form=document.querySelector('#login'),msg=document.querySelector('#msg'),btn=document.querySelector('#submit'),googleBtn=document.querySelector('#googleLogin');
async function verifyAdmin(){const {data:role,error}=await db.rpc('get_my_admin_role');if(error||!['owner','admin'].includes(role)){await db.auth.signOut();msg.textContent='هذا الحساب لا يملك صلاحية الإدارة.';return false}location.href='dashboard.html';return true}
(async()=>{const {data:{session}}=await db.auth.getSession();if(session) await verifyAdmin();})();
form.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='جارٍ التحقق…';btn.disabled=true;const {error}=await db.auth.signInWithPassword({email:document.querySelector('#email').value.trim(),password:document.querySelector('#password').value});if(error){msg.textContent='تعذر تسجيل الدخول. تحقق من البريد وكلمة المرور.';btn.disabled=false;return}await verifyAdmin();});
googleBtn.addEventListener('click',async()=>{msg.textContent='سيتم فتح Google…';googleBtn.disabled=true;const {error}=await db.auth.signInWithOAuth({provider:'google',options:{redirectTo:`${window.location.origin}/admin/`}});if(error){msg.textContent='تعذر بدء تسجيل الدخول عبر Google.';googleBtn.disabled=false;}});
</script></body></html>
